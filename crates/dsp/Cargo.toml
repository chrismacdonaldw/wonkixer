[package]
name = "wonkixer-dsp"
version.workspace = true
edition.workspace = true
repository.workspace = true

[lib]
name = "wonkixer_dsp"

[dependencies]
nnnoiseless = { version = "0.5", default-features = false }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
assert_no_alloc = { version = "1", features = [] }
hound = "3.5"
serde_json = "1"
